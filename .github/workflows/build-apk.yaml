name: Build APK and release

# Builds a signed release APK on every branch push and attaches it to a
# GitHub prerelease tagged pre-<shortsha>.
#
# Secrets (same names as build.yaml / 8vim/build.gradle.kts):
#   SIGNING_KEYSTORE_BASE64, VIM8_BUILD_KEYSTORE_PASSWORD,
#   VIM8_BUILD_KEY_ALIAS, VIM8_BUILD_KEY_PASSWORD
# If they are missing, a throwaway keystore is generated so the build still
# succeeds (such APKs cannot be installed over APKs signed with the real key).

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Compute version info
        id: vars
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          BASE="$(grep -E '^(MAJOR|MINOR|PATCH)=' 8vim/version.properties | cut -d= -f2 | paste -sd. -)"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "tag=pre-${SHORT_SHA}"
            echo "asset=8vim-${BASE}-${SHORT_SHA}.apk"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install NDK and CMake
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Prepare keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.VIM8_BUILD_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.VIM8_BUILD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.VIM8_BUILD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="${RUNNER_TEMP}/8vim.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            echo "signed_with=release key" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets missing; using a generated throwaway keystore."
            KS_PASS="$(openssl rand -hex 16)"; KEY_PASS="$KS_PASS"; KS_ALIAS="ci"
            echo "::add-mask::$KS_PASS"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=8VIM CI, O=CI"
            echo "signed_with=throwaway CI key" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "VIM8_BUILD_KEYSTORE_FILE=$KS"
            echo "VIM8_BUILD_KEYSTORE_PASSWORD=$KS_PASS"
            echo "VIM8_BUILD_KEY_ALIAS=$KS_ALIAS"
            echo "VIM8_BUILD_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and verify APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find 8vim/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -n1)"
          [ -n "$APK" ] || { echo "No signed APK found"; find 8vim/build/outputs -name '*.apk'; exit 1; }
          OUT="${RUNNER_TEMP}/${{ steps.vars.outputs.asset }}"
          cp "$APK" "$OUT"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner | sort | tail -n1)"
          "$APKSIGNER" verify --verbose "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.asset }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.vars.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          body: |
            Automated build of `${{ github.ref_name }}` @ ${{ github.sha }}
            Signed with: ${{ steps.keystore.outputs.signed_with }}
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
